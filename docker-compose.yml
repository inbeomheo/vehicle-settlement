services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vehicle_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?운영 DB 비밀번호를 설정하세요}
    ports:
      - '127.0.0.1:${PG_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
